name: reusable - lint
on:
  workflow_call:
jobs:
  commits:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-lint-commits-conventional.yml
    permissions:
      pull-requests: read
  go:
    uses: ./.github/workflows/reusable-lint-files-go.yml
  json:
    uses: ./.github/workflows/reusable-lint-files-json.yml
  md:
    uses: ./.github/workflows/reusable-lint-files-md.yml
  yaml:
    uses: ./.github/workflows/reusable-lint-files-yaml.yml
